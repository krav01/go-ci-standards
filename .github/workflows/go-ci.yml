name: Reusable Go CI

on:
  workflow_call:
    inputs:
      run_race:
        description: Run race detector
        required: false
        default: false
        type: boolean
      run_vulncheck:
        description: Run govulncheck
        required: false
        default: true
        type: boolean
      run_lint:
        description: Run golangci-lint
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -shuffle=on ./...

  lint:
    name: Lint
    if: inputs.run_lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  vulnerability:
    name: Vulnerability scan
    if: inputs.run_vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Govulncheck
        run: govulncheck ./...

  race:
    name: Race detector
    if: inputs.run_race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Race
        run: go test -race -shuffle=on ./...
